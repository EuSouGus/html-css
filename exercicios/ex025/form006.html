<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <!--method="POST" é obrigatório quando os elementos passam de 3.000 bytes-->
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="color" id="icolor">
        </p>

        <p>
            <label for="inivel">Nível de satisfação</label>
            <input type="range" name="nível" id="inivel" min="1" max="5" value="2">
        </p>

        <p>
            <!--quando usa o type="file" o formulario deve usar o método POST para enviar o arquivo-->
            <label for="ifoto">Foto de perfil</label>
            <input type="file" name="foto" id="ifoto">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
